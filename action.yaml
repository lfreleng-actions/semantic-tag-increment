# SPDX-FileCopyrightText: 2025 The Linux Foundation

# semantic-tag-increment
name: '🏷️ Increment Semantic Tag'
description: 'Increments semantic version tags'
# Supports complex pre-release patterns

inputs:
  tag:
    description: 'The existing semantic tag to be incremented'
    required: true
  increment:
    description: 'Increment type: major, minor, patch, prerelease, dev'
    required: false
    default: 'dev'
  prerelease_type:
    description: 'Type of prerelease identifier (dev, alpha, beta, rc, etc.)'
    required: false
  path:
    description: 'Directory location for git operations'
    required: false
    default: '.'
  debug:
    description: 'Enable verbose debug output'
    required: false
    default: 'false'
  check_tags:
    description: 'Whether to fetch and check against repository tags'
    required: false
    default: 'true'
  preserve_metadata:
    description: 'Whether to preserve build metadata during version increments'
    required: false
    default: 'false'
  fetch_timeout:
    description: 'Timeout in seconds for git remote fetch operations'
    required: false
    default: '120'

outputs:
  tag:
    description: 'The incremented tag string with any original prefix'
    value: "${{ steps.increment.outputs.tag }}"
  numeric_tag:
    description: 'Numeric tag stripped of any v/V prefix'
    value: "${{ steps.increment.outputs.numeric_tag }}"

runs:
  using: 'composite'
  steps:
    - name: 'Setup action/environment'
      shell: bash
      env:
        INPUT_PATH: "${{ inputs.path }}"
      run: |
        # Setup action/environment

        # Verify path is a valid directory
        if [ ! -d "$INPUT_PATH" ]; then
          echo "Error: invalid path/directory $INPUT_PATH ❌"
          exit 1
        fi

    - name: 'Setup Python'
      # yamllint disable rule:line-length
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        # A relative path would resolve against the caller's workspace
        python-version-file: "${{ github.action_path }}/pyproject.toml"
        # No automatic caching

    # hashFiles() only sees the caller's workspace, not the action path.
    # -I keeps the caller's workspace, the working directory here, off
    # sys.path so a hashlib.py there is not imported.
    - name: 'Hash action dependencies'
      id: pyproject-hash
      shell: bash
      env:
        ACTION_PATH: "${{ github.action_path }}"
      run: |
        # Hash action dependencies
        hash=$(python -I -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$ACTION_PATH/pyproject.toml")
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    # Manual caching with proper paths and key
    - name: Cache pip packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: pip-cache
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ steps.pyproject-hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-python-

    - name: 'Cache debug info'
      if: always()
      shell: bash
      # yamllint disable rule:line-length
      env:
        CACHE_HIT: "${{ steps.pip-cache.outputs.cache-hit }}"
        RUNNER_OS: "${{ runner.os }}"
        PYPROJECT_HASH: "${{ steps.pyproject-hash.outputs.hash }}"
      run: |
        echo "Cache Hit: $CACHE_HIT"
        echo "Runner OS: $RUNNER_OS"
        echo "Cache Key: ${RUNNER_OS}-python-${PYPROJECT_HASH}"

    # yamllint disable rule:line-length
    - name: 'Install semantic-tag-increment'
      shell: bash
      env:
        ACTION_PATH: "${{ github.action_path }}"
      run: |
        # -I covers pip itself but not the subprocesses it starts to
        # build the package, which honour PYTHONPATH. An inherited
        # empty entry would put the caller's workspace, the working
        # directory here, on their sys.path and run a sitecustomize.py
        # from it.
        unset PYTHONPATH

        # -I so a pip/ package in the caller's workspace is not imported
        python -I -m pip install --upgrade pip

        # Clean install the package
        echo "Installing from $ACTION_PATH"
        python -I -m pip install "$ACTION_PATH"

    - name: 'Increment semantic tag'
      id: increment
      shell: bash
      env:
        INPUT_TAG: "${{ inputs.tag }}"
        INPUT_INCREMENT: "${{ inputs.increment }}"
        INPUT_PRERELEASE_TYPE: "${{ inputs.prerelease_type }}"
        INPUT_PATH: "${{ inputs.path }}"
        INPUT_CHECK_TAGS: "${{ inputs.check_tags }}"
        INPUT_PRESERVE_METADATA: "${{ inputs.preserve_metadata }}"
        INPUT_FETCH_TIMEOUT: "${{ inputs.fetch_timeout }}"
      run: |
        # Increment semantic tag

        # Set error handling
        set -e

        # Validate required tag input
        if [ -z "$INPUT_TAG" ] || [ "$INPUT_TAG" = "" ]; then
          echo "Error: tag input is required ❌"
          exit 1
        fi

        # Validate increment type
        case "$INPUT_INCREMENT" in
          major|minor|patch|prerelease|dev)
            # Valid increment type
            ;;
          *)
            echo "Error: invalid increment type '$INPUT_INCREMENT' ❌"
            echo 'Valid types: major, minor, patch, prerelease, dev'
            exit 1
            ;;
        esac

        # The installed tool needs no search path of its own. An inherited
        # PYTHONPATH with an empty entry would put the caller's workspace,
        # the working directory here, on its sys.path and run a
        # sitecustomize.py from it.
        unset PYTHONPATH

        # Run the semantic tag increment tool
        # Tool automatically detects GitHub Actions mode and writes outputs

        # Build the argument list. Each input is one argument, passed as
        # text: nothing in it is run as a command.
        args=(--tag "$INPUT_TAG" --increment "$INPUT_INCREMENT" --path "$INPUT_PATH")

        # Add prerelease type if provided
        if [ -n "$INPUT_PRERELEASE_TYPE" ]; then
          args+=(--prerelease-type "$INPUT_PRERELEASE_TYPE")
        fi

        # Handle conflict checking based on check_tags setting
        if [ "$INPUT_CHECK_TAGS" = "false" ]; then
          args+=(--no-check-conflicts)
        else
          args+=(--check-conflicts)
        fi

        # Handle metadata preservation setting
        if [ "$INPUT_PRESERVE_METADATA" = "true" ]; then
          args+=(--preserve-metadata)
        else
          args+=(--no-preserve-metadata)
        fi

        semantic-tag-increment "${args[@]}"
